<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOBAN｜案件一覧</title><style>
body{margin:0;background:#f5f5f2;color:#222;font-family:Arial,'Noto Sans JP',sans-serif}.wrap{max-width:1050px;margin:auto;padding:48px 28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}h1{margin:0;font-size:28px}.ey{font-size:10px;color:#999;letter-spacing:.12em;margin-bottom:8px}.new,.open{border:0;background:#262824;color:#fff;border-radius:7px;padding:10px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;min-height:130px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.name{font-size:18px;font-weight:600}.client,.meta{font-size:11px;color:#777;margin-top:7px}.meta{display:flex;justify-content:space-between}.modal{display:none;position:fixed;inset:0;background:#0005;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:#fff;padding:24px;border-radius:12px;width:min(420px,calc(100% - 40px))}.box h2{margin-top:0}.box input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:6px}.actions{text-align:right}.cancel{padding:9px 13px;border:1px solid #ddd;background:#fff;border-radius:6px;margin-right:6px}.create{padding:9px 13px;border:0;background:#262824;color:#fff;border-radius:6px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><div class="ey">KOBAN / CAMERA DIRECTION</div><h1>案件一覧</h1></div><button class="new" onclick="showNew()">＋ 新規案件</button></div><div id="grid" class="grid"></div></div>
<div id="modal" class="modal"><div class="box"><h2>新規案件</h2><label>案件名</label><input id="pn" placeholder="例：2028年度新卒採用"><label>クライアント名</label><input id="pc" placeholder="例：○○株式会社"><div class="actions"><button class="cancel" onclick="hideNew()">キャンセル</button><button class="create" onclick="create()">案件を作成</button></div></div></div>
<script>
const K='koban_projects_v1',seed=[{id:'demo-maruka',name:'丸加ホールディングス',client:'丸加ホールディングス',status:'撮影設計中'},{id:'demo-fujiart',name:'フジアール',client:'フジアール',status:'撮影設計中'}];
function list(){try{let x=JSON.parse(localStorage.getItem(K));if(x)return x}catch(e){}localStorage.setItem(K,JSON.stringify(seed));return seed}
function save(x){localStorage.setItem(K,JSON.stringify(x))}
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let x=list();document.getElementById('grid').innerHTML=x.map(p=>`<div class="card" onclick="openP('${p.id}')"><div><div class="name">${esc(p.name)}</div><div class="client">${esc(p.client)}</div></div><div class="meta"><span>${esc(p.status||'未着手')}</span><span>撮影設計</span></div></div>`).join('')}
function openP(id){location.href='app.html?project='+encodeURIComponent(id)}
function showNew(){document.getElementById('modal').classList.add('show');document.getElementById('pn').focus()}
function hideNew(){document.getElementById('modal').classList.remove('show')}
function create(){let n=document.getElementById('pn').value.trim(),c=document.getElementById('pc').value.trim();if(!n)return;let x=list();let id='p_'+Date.now().toString(36);x.unshift({id,name:n,client:c,status:'未着手'});save(x);openP(id)}
render();
</script></body></html>
